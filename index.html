<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="index.css">
</head>
<body>
<h1>Hero Name, Class</h1>
<div class="infoMenuBar">
  <div class="stats">
    <p>Health</p><p id="health">10</p>
    <p>Level</p><p id="level">1</p>
    <p>Experience</p><p id="exp">0</p>
    <p>Gold</p><p id="gold">0</p>
  </div>

  <div class="bars">
    <progress id="expBar" class="exp" max="10" value="0"></progress>
    <progress id="healthBar" class="hp" max="10" value="10"></progress>
  </div>
</div>
</div>

<div class="buttonmenu">
  <button onclick="changeText('wildlands')">Wildlands</button>
  <button onclick="changeText('quest')">Quest</button>
  <button onclick="changeText('market')">Market</button>
</div>

<div class="content">
  <div class="leftColumn">
    <div class="contentleft">
      <p id="contentTextLeft"></p>
      <div id="alertContainer"></div>
    </div>

    <div class="contentleft secondLeft">
      <p id="contentTextLeft2"></p>
    </div>
  </div>

  <div class="contentright" id="contentTextRight"></div>
</div>

<script type="module" src="./main.js"></script>
<div class="footer">Footer</div>
</body>
</html>
